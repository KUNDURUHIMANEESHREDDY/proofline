# Run `forge register proofline` once to populate app.id before lint/deploy.
app:
  runtime:
    name: nodejs24.x
    memoryMB: 512
  storage:
    entities:
      - name: proofline-issue-state
        attributes:
          version:
            type: integer
          summaryJson:
            type: string
      - name: proofline-evidence
        attributes:
          recordJson:
            type: string
modules:
  jira:issuePanel:
    - key: proofline-issue-panel
      resource: proofline-ui
      resolver:
        function: proofline-resolver
      render: native
      title: Proofline
  webtrigger:
    - key: github-actions-evidence
      function: github-actions-ingress
      urlFormat: v2
      response:
        type: static
        outputs:
          - key: accepted
            statusCode: 201
            contentType: application/json
            body: '{"accepted":true}'
          - key: method-not-allowed
            statusCode: 405
            contentType: application/json
            body: '{"error":"method_not_allowed"}'
          - key: payload-too-large
            statusCode: 413
            contentType: application/json
            body: '{"error":"payload_too_large_or_missing"}'
          - key: unauthorized
            statusCode: 401
            contentType: application/json
            body: '{"error":"unauthorized"}'
          - key: invalid-request
            statusCode: 400
            contentType: application/json
            body: '{"error":"invalid_request"}'
          - key: conflict
            statusCode: 409
            contentType: application/json
            body: '{"error":"conflict"}'
          - key: temporarily-unavailable
            statusCode: 503
            contentType: application/json
            body: '{"error":"temporarily_unavailable"}'
  function:
    - key: proofline-resolver
      handler: index.handler
    - key: github-actions-ingress
      handler: index.ingest
resources:
  - key: proofline-ui
    path: src/frontend/index.jsx
permissions:
  scopes:
    - storage:app
    - read:jira-work
